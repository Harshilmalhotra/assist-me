server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # File upload size limit for recording uploads
    client_max_body_size 500M;

    # React SPA
    location / {
        root /var/www/videosupport;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # API
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Socket.IO — must use upgrade for WebSocket
    location /socket.io/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Uploaded files
    location /uploads/ {
        alias /var/videosupport/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Metrics — restrict to localhost only
    location /metrics {
        proxy_pass http://localhost:3001/metrics;
        allow 127.0.0.1;
        deny all;
    }
}
